# =====================================================
# URMIS - Development Docker Compose (hot reload)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =====================================================

services:
  db:
    ports:
      - '5432:5432'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: development
      PORT: 5000
      # Inside the container network, PostgreSQL is reached via the "db" host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-urmis_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-not-for-production}
    volumes:
      # Mount source for hot reload (backend source + prisma)
      - ./backend:/usr/src/app/backend
      - ./prisma:/usr/src/app/prisma
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run backend:start"
    # `depends_on` health conditions are inherited from the base compose.

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:5000}
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:5000}
    volumes:
      # Mount source for hot reload (Next.js App Router in src/)
      - ./src:/usr/src/app/src
      - ./public:/usr/src/app/public
    command: sh -c "npx prisma generate && npm run dev"

volumes:
  db_data:
